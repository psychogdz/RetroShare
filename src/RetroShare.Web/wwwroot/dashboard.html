<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div id="shell"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initShell } from '/assets/js/app.js';
        import { api } from '/assets/js/api.js';
        import { escapeHtml, formatBytes, formatDate, fileIcon } from '/assets/js/ui.js';

        const user = await initShell({ permission: 'profile.view' });
        if (!user) throw new Error('unauthenticated');

        const data = await api.dashboard();
        const percent = data.storageQuotaBytes
            ? Math.min(100, data.storageUsedBytes / data.storageQuotaBytes * 100) : 0;
        const meterClass = percent >= 90 ? 'full' : percent >= 70 ? 'warn' : '';

        const adminSection = user.permissions.includes('system.manage') ? `
            <div class="col-12 mt-2">
                <div class="rs-panel d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <div class="rs-stat-value rs-display mb-1">⚙ ADMIN</div>
                        <div class="rs-filemeta">System-wide statistics and management tools.</div>
                    </div>
                    <a class="btn btn-secondary btn-sm" href="/admin.html">Open admin panel ▸</a>
                </div>
            </div>` : '';

        document.getElementById('page').innerHTML = `
            <h2 class="mb-4">Dashboard</h2>

            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="rs-stat">
                        <div class="rs-stat-value">${data.totalFiles}</div>
                        <div class="rs-stat-label">Files</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="rs-stat">
                        <div class="rs-stat-value">${formatBytes(data.storageUsedBytes)}</div>
                        <div class="rs-stat-label">Storage used</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="rs-stat">
                        <div class="rs-stat-value">${data.shareCount}</div>
                        <div class="rs-stat-label">Share links</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="rs-stat">
                        <div class="rs-stat-value">${data.trashCount}</div>
                        <div class="rs-stat-label">In trash</div>
                    </div>
                </div>
            </div>

            <div class="rs-panel mb-4">
                <div class="rs-panel-title">STORAGE QUOTA</div>
                <div class="rs-meter mb-2"><div class="rs-meter-fill ${meterClass}" style="width:${percent.toFixed(1)}%"></div></div>
                <div class="rs-filemeta d-flex justify-content-between flex-wrap gap-2">
                    <span>${formatBytes(data.storageUsedBytes)} used of ${formatBytes(data.storageQuotaBytes)}</span>
                    <span>${percent.toFixed(1)}%</span>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-6">
                    <div class="rs-panel h-100">
                        <div class="rs-panel-title">RECENT FILES</div>
                        ${data.recentFiles.length ? `
                            <div class="d-flex flex-column gap-2">
                                ${data.recentFiles.map((file) => `
                                    <div class="d-flex align-items-center gap-2">
                                        ${fileIcon(file.extension)}
                                        <div class="flex-grow-1 min-w-0">
                                            <div class="rs-filename text-truncate">${escapeHtml(file.name)}</div>
                                            <div class="rs-filemeta">${formatBytes(file.size)} · ${formatDate(file.createdAt)}</div>
                                        </div>
                                    </div>`).join('')}
                            </div>
                            <div class="text-end mt-3"><a class="rs-link" href="/files.html">Browse all files ▸</a></div>`
                        : '<div class="rs-empty"><div class="rs-empty-icon">[ ]</div>No files yet — <a class="rs-link" href="/files.html">upload your first one</a></div>'}
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="rs-panel h-100">
                        <div class="rs-panel-title">RECENT ACTIVITY</div>
                        ${data.recentActivity.length ? `
                            <div class="rs-terminal">
                                ${data.recentActivity.map((entry) =>
                                    `<div><span style="color:#6d7f99">[${formatDate(entry.createdAt)}]</span> ${escapeHtml(entry.description)}</div>`).join('')}
                            </div>
                            <div class="text-end mt-3"><a class="rs-link" href="/activity.html">Full history ▸</a></div>`
                        : '<div class="rs-empty"><div class="rs-empty-icon">[ ]</div>No activity recorded yet.</div>'}
                    </div>
                </div>
                ${adminSection}
            </div>`;
    </script>
</body>
</html>
