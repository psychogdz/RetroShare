<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trash — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div id="shell"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initShell } from '/assets/js/app.js';
        import { api } from '/assets/js/api.js';
        import { confirmDialog, escapeHtml, fileIcon, formatBytes, formatDate, toast } from '/assets/js/ui.js';

        const user = await initShell({ permission: 'files.view' });
        if (!user) throw new Error('unauthenticated');

        const state = { page: 1 };
        document.getElementById('page').innerHTML = `
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="mb-0">Trash</h2>
                <span class="rs-filemeta" id="count-label"></span>
            </div>
            <div id="trash-area"></div>
            <div class="d-flex justify-content-center mt-3" id="pagination"></div>`;

        async function refresh() {
            const result = await api.trash(`?page=${state.page}&pageSize=20`);
            document.getElementById('count-label').textContent =
                `${result.total} item${result.total === 1 ? '' : 's'} in trash`;

            const area = document.getElementById('trash-area');
            if (!result.items.length) {
                area.innerHTML = '<div class="rs-empty"><div class="rs-empty-icon">♲</div>Trash is empty.</div>';
            } else {
                area.innerHTML = `<div class="row g-2">${result.items.map((file) => `
                    <div class="col-12 col-md-6 col-xl-4">
                        <div class="rs-filecard" style="opacity:.75">
                            ${fileIcon(file.extension)}
                            <div class="flex-grow-1 min-w-0">
                                <div class="rs-filename">${escapeHtml(file.name)}</div>
                                <div class="rs-filemeta">${formatBytes(file.size)} · deleted ${formatDate(file.deletedAt)}</div>
                            </div>
                            <div class="d-flex flex-column gap-1">
                                <button class="btn btn-sm btn-primary rs-restore" data-id="${file.id}">Restore</button>
                                <button class="btn btn-sm btn-danger rs-purge" data-id="${file.id}" data-name="${escapeHtml(file.name)}">Delete forever</button>
                            </div>
                        </div>
                    </div>`).join('')}</div>`;
            }

            const pagination = document.getElementById('pagination');
            if (result.totalPages > 1) {
                pagination.innerHTML = `<ul class="pagination mb-0">
                    <li class="page-item ${result.hasPrevious ? '' : 'disabled'}"><a class="page-link" href="#" data-page="${state.page - 1}">‹</a></li>
                    <li class="page-item active"><a class="page-link" href="#">${state.page} / ${result.totalPages}</a></li>
                    <li class="page-item ${result.hasNext ? '' : 'disabled'}"><a class="page-link" href="#" data-page="${state.page + 1}">›</a></li>
                </ul>`;
            } else {
                pagination.innerHTML = '';
            }

            pagination.querySelectorAll('a[data-page]').forEach((link) => link.addEventListener('click', (e) => {
                e.preventDefault();
                if (link.parentElement.classList.contains('disabled')) return;
                state.page = Number(link.dataset.page);
                refresh();
            }));

            area.querySelectorAll('.rs-restore').forEach((el) => el.addEventListener('click', async () => {
                try {
                    await api.trashRestore(el.dataset.id);
                    toast('File restored');
                    refresh();
                } catch (err) { toast(err.message, 'err'); }
            }));

            area.querySelectorAll('.rs-purge').forEach((el) => el.addEventListener('click', async () => {
                if (!await confirmDialog('Delete permanently',
                    `Permanently delete <b>${el.dataset.name}</b>? The physical file will be destroyed — this cannot be undone.`,
                    { danger: true, confirmLabel: 'Delete forever' })) return;
                try {
                    await api.trashDelete(el.dataset.id);
                    toast('File permanently deleted');
                    refresh();
                } catch (err) { toast(err.message, 'err'); }
            }));
        }

        await refresh();
    </script>
</body>
</html>
