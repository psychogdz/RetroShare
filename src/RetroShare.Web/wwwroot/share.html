<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared file — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width:520px">
        <div class="text-center my-5">
            <a class="rs-logo" href="/"><span class="rs-block"></span>RetroShare</a>
        </div>
        <div class="rs-panel">
            <div class="rs-panel-title">&gt; SHARED FILE</div>
            <div id="share-body">
                <div class="rs-terminal">loading share…_</div>
            </div>
        </div>
        <div class="rs-filemeta text-center my-4">powered by <a class="rs-link" href="/">RetroShare</a> — files stream over gRPC</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { api } from '/assets/js/api.js';
        import { downloadFile } from '/assets/js/grpc.js';
        import { escapeHtml, formatBytes, formatSpeed, SpeedTracker } from '/assets/js/ui.js';

        const token = new URLSearchParams(location.search).get('token')
            ?? (location.pathname.startsWith('/s/') ? location.pathname.slice(3) : null);
        const body = document.getElementById('share-body');

        if (!token) {
            body.innerHTML = '<div class="alert alert-danger mb-0" style="border-radius:0">No share token in the URL.</div>';
        } else {
            let info;
            try {
                info = await api.shareInfo(token);
            } catch (err) {
                body.innerHTML = `<div class="alert alert-danger mb-0" style="border-radius:0">${escapeHtml(err.message)}</div>`;
                throw err;
            }

            body.innerHTML = `
                <div class="d-flex align-items-center gap-3 mb-3">
                    <span class="rs-fileicon" style="width:52px;height:52px;font-size:.9rem">${escapeHtml((info.fileName.split('.').pop() || '?').slice(0, 4))}</span>
                    <div>
                        <div class="rs-filename" style="font-size:1.05rem">${escapeHtml(info.fileName)}</div>
                        <div class="rs-filemeta">${formatBytes(info.fileSize)}${info.expiresAt ? ` · expires ${new Date(info.expiresAt).toLocaleDateString()}` : ''}</div>
                    </div>
                </div>
                ${info.requiresPassword ? `
                    <div class="mb-3">
                        <label class="form-label" for="share-password">Password</label>
                        <input class="form-control" id="share-password" type="password" autocomplete="off">
                    </div>` : ''}
                <button class="btn btn-primary w-100" id="download-btn">▼ Download file</button>
                <div class="mt-3" id="progress-area" style="display:none">
                    <div class="rs-progress mb-1"><div class="rs-progress-fill" id="progress-fill" style="width:0%"></div></div>
                    <div class="rs-filemeta d-flex gap-3 flex-wrap" id="progress-stats"></div>
                </div>`;

            document.getElementById('download-btn').addEventListener('click', async (event) => {
                const button = event.target;
                button.disabled = true;
                button.textContent = '▼ Streaming…';
                const password = document.getElementById('share-password')?.value || null;
                const area = document.getElementById('progress-area');
                const fill = document.getElementById('progress-fill');
                const stats = document.getElementById('progress-stats');
                area.style.display = '';
                const tracker = new SpeedTracker();

                try {
                    const result = await downloadFile({
                        shareToken: token,
                        sharePassword: password,
                        onProgress: (received, total) => {
                            tracker.update(received);
                            const percent = total ? received / total * 100 : 100;
                            fill.style.width = `${percent.toFixed(1)}%`;
                            stats.innerHTML = `<span>${formatBytes(received)} / ${formatBytes(total)}</span>
                                <span>${percent.toFixed(0)}%</span>
                                <span>${formatSpeed(tracker.bytesPerSecond)}</span>`;
                        },
                    });
                    fill.classList.add('done');
                    fill.style.width = '100%';
                    stats.innerHTML = `<span>done ✓ ${formatBytes(result.size)}</span>`;
                } catch (err) {
                    fill.classList.add('error');
                    fill.style.width = '100%';
                    stats.innerHTML = `<span style="color:var(--rs-red)">${escapeHtml(err.message)}</span>`;
                } finally {
                    button.disabled = false;
                    button.textContent = '▼ Download file';
                }
            });
        }
    </script>
</body>
</html>
