<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Links — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div id="shell"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initShell } from '/assets/js/app.js';
        import { api } from '/assets/js/api.js';
        import { confirmDialog, escapeHtml, formatBytes, formatDate, toast } from '/assets/js/ui.js';

        const user = await initShell({ permission: 'shares.view' });
        if (!user) throw new Error('unauthenticated');

        const state = { page: 1 };
        document.getElementById('page').innerHTML = `
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="mb-0">Share Links</h2>
                <span class="rs-filemeta" id="count-label"></span>
            </div>
            <div class="table-responsive rs-panel">
                <table class="table mb-0 align-middle">
                    <thead>
                        <tr><th>File</th><th>Link</th><th>Protection</th><th>Downloads</th><th>Status</th><th>Created</th><th></th></tr>
                    </thead>
                    <tbody id="shares-body"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-center mt-3" id="pagination"></div>`;

        async function refresh() {
            const result = await api.shares(state.page);
            document.getElementById('count-label').textContent = `${result.total} link${result.total === 1 ? '' : 's'}`;
            const body = document.getElementById('shares-body');

            if (!result.items.length) {
                body.innerHTML = '<tr><td colspan="7"><div class="rs-empty"><div class="rs-empty-icon">⇄</div>No share links yet. Create one from the Files page.</div></td></tr>';
            } else {
                body.innerHTML = result.items.map((share) => {
                    const expired = share.isExpired;
                    const exhausted = share.maxDownloads !== null && share.downloadCount >= share.maxDownloads;
                    const status = !share.isActive
                        ? '<span class="badge rs-badge-dim">revoked</span>'
                        : expired ? '<span class="badge rs-badge-red">expired</span>'
                        : exhausted ? '<span class="badge rs-badge-amber">limit reached</span>'
                        : '<span class="badge rs-badge-green">active</span>';
                    return `<tr>
                        <td><div class="rs-filename">${escapeHtml(share.fileName)}</div>
                            <div class="rs-filemeta">${formatBytes(share.fileSize)}</div></td>
                        <td><code style="font-size:.78rem">/s/${escapeHtml(share.token.slice(0, 10))}…</code></td>
                        <td>${share.hasPassword ? '<span class="badge rs-badge-cyan">password</span>' : '<span class="rs-filemeta">public</span>'}</td>
                        <td>${share.downloadCount}${share.maxDownloads !== null ? ` / ${share.maxDownloads}` : ''}</td>
                        <td>${status}</td>
                        <td class="rs-filemeta">${formatDate(share.createdAt)}</td>
                        <td class="text-nowrap">
                            <button class="btn btn-sm btn-outline-secondary rs-copy" data-token="${share.token}">Copy</button>
                            ${share.isActive ? `<button class="btn btn-sm btn-danger rs-revoke" data-id="${share.id}">Revoke</button>` : ''}
                        </td>
                    </tr>`;
                }).join('');
            }

            const pagination = document.getElementById('pagination');
            if (result.totalPages > 1) {
                pagination.innerHTML = `<ul class="pagination mb-0">
                    <li class="page-item ${result.hasPrevious ? '' : 'disabled'}"><a class="page-link" href="#" data-page="${state.page - 1}">‹</a></li>
                    <li class="page-item active"><a class="page-link" href="#">${state.page} / ${result.totalPages}</a></li>
                    <li class="page-item ${result.hasNext ? '' : 'disabled'}"><a class="page-link" href="#" data-page="${state.page + 1}">›</a></li>
                </ul>`;
            } else {
                pagination.innerHTML = '';
            }

            pagination.querySelectorAll('a[data-page]').forEach((link) => link.addEventListener('click', (e) => {
                e.preventDefault();
                if (link.parentElement.classList.contains('disabled')) return;
                state.page = Number(link.dataset.page);
                refresh();
            }));

            body.querySelectorAll('.rs-copy').forEach((el) => el.addEventListener('click', async () => {
                await navigator.clipboard.writeText(`${location.origin}/s/${el.dataset.token}`);
                toast('Share link copied');
            }));

            body.querySelectorAll('.rs-revoke').forEach((el) => el.addEventListener('click', async () => {
                if (!await confirmDialog('Revoke share link',
                    'The link stops working immediately. Anyone holding it will get an error.', { danger: true, confirmLabel: 'Revoke' })) return;
                try {
                    await api.revokeShare(el.dataset.id);
                    toast('Share link revoked');
                    refresh();
                } catch (err) { toast(err.message, 'err'); }
            }));
        }

        await refresh();
    </script>
</body>
</html>
