<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width:440px">
        <div class="text-center my-5">
            <a class="rs-logo" href="/"><span class="rs-block"></span>RetroShare</a>
        </div>

        <div class="rs-panel">
            <div class="rs-panel-title">&gt; LOG IN</div>
            <div id="alert-box"></div>
            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="login">Username or email</label>
                    <input class="form-control" id="login" name="login" autocomplete="username" required maxlength="256" autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
                </div>
                <button class="btn btn-primary w-100" type="submit" id="submit-btn">Log in ▸</button>
            </form>
            <div class="rs-filemeta text-center mt-3">
                No account? <a class="rs-link" href="/register.html">Register here</a>
            </div>
        </div>

        <div class="rs-terminal mt-3" id="boot-line">authenticating user…</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { api, Auth } from '/assets/js/api.js';
        import { toast } from '/assets/js/ui.js';

        if (new URLSearchParams(location.search).has('expired')) {
            document.getElementById('alert-box').innerHTML =
                '<div class="alert alert-danger py-2" style="border-radius:0">Session expired — please log in again.</div>';
        }
        if (Auth.isAuthenticated) {
            window.location.href = '/dashboard.html';
        }

        document.getElementById('boot-line').textContent =
            '> retroshare v1.0 — control plane REST / data plane gRPC — ready_';

        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('submit-btn');
            button.disabled = true;
            button.textContent = 'Authenticating…';
            try {
                const result = await api.login({
                    login: form.login.value.trim(),
                    password: form.password.value,
                });
                Auth.setSession(result);
                toast(`Welcome back, ${result.user.username}!`);
                window.location.href = '/dashboard.html';
            } catch (err) {
                document.getElementById('alert-box').innerHTML =
                    `<div class="alert alert-danger py-2" style="border-radius:0">${err.message}</div>`;
                button.disabled = false;
                button.textContent = 'Log in ▸';
            }
        });
    </script>
</body>
</html>
