<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div id="shell"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initShell } from '/assets/js/app.js';
        import { api } from '/assets/js/api.js';
        import { escapeHtml, formatDate } from '/assets/js/ui.js';

        const user = await initShell({ permission: 'profile.view' });
        if (!user) throw new Error('unauthenticated');

        const state = { page: 1 };
        document.getElementById('page').innerHTML = `
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="mb-0">Activity</h2>
                <span class="rs-filemeta" id="count-label"></span>
            </div>
            <div class="rs-terminal" id="activity-log" style="min-height:200px"></div>
            <div class="d-flex justify-content-center mt-3" id="pagination"></div>`;

        async function refresh() {
            const result = await api.activity(state.page, 30);
            document.getElementById('count-label').textContent = `${result.total} event${result.total === 1 ? '' : 's'}`;
            const log = document.getElementById('activity-log');
            log.innerHTML = result.items.length
                ? result.items.map((entry) =>
                    `<div><span style="color:#6d7f99">[${formatDate(entry.createdAt)}]</span> ${escapeHtml(entry.description)}</div>`).join('')
                : '<div style="color:#6d7f99">no activity recorded yet_</div>';

            const pagination = document.getElementById('pagination');
            if (result.totalPages > 1) {
                pagination.innerHTML = `<ul class="pagination mb-0">
                    <li class="page-item ${result.hasPrevious ? '' : 'disabled'}"><a class="page-link" href="#" data-page="${state.page - 1}">‹</a></li>
                    <li class="page-item active"><a class="page-link" href="#">${state.page} / ${result.totalPages}</a></li>
                    <li class="page-item ${result.hasNext ? '' : 'disabled'}"><a class="page-link" href="#" data-page="${state.page + 1}">›</a></li>
                </ul>`;
            }
            pagination.querySelectorAll('a[data-page]').forEach((link) => link.addEventListener('click', (e) => {
                e.preventDefault();
                if (link.parentElement.classList.contains('disabled')) return;
                state.page = Number(link.dataset.page);
                refresh();
            }));
        }

        await refresh();
    </script>
</body>
</html>
