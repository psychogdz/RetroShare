<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — RetroShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/retro.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width:480px">
        <div class="text-center my-5">
            <a class="rs-logo" href="/"><span class="rs-block"></span>RetroShare</a>
        </div>

        <div class="rs-panel">
            <div class="rs-panel-title">&gt; CREATE ACCOUNT</div>
            <div id="alert-box"></div>
            <form id="register-form" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" required minlength="3" maxlength="32"
                        pattern="[a-zA-Z0-9_.\-]+" autocomplete="username" autofocus>
                    <div class="rs-filemeta">3–32 chars: letters, digits, . _ -</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" required maxlength="256" autocomplete="email">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="displayName">Display name (optional)</label>
                    <input class="form-control" id="displayName" name="displayName" maxlength="64">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
                    <div class="rs-filemeta">min 8 chars, 3 of: lowercase / uppercase / digits / symbols</div>
                </div>
                <button class="btn btn-primary w-100" type="submit" id="submit-btn">Register ▸</button>
            </form>
            <div class="rs-filemeta text-center mt-3">
                Already registered? <a class="rs-link" href="/login.html">Log in</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { api, Auth } from '/assets/js/api.js';
        import { toast } from '/assets/js/ui.js';

        if (Auth.isAuthenticated) window.location.href = '/dashboard.html';

        document.getElementById('register-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const button = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = '';
            button.disabled = true;
            button.textContent = 'Creating…';

            try {
                const result = await api.register({
                    username: form.username.value.trim(),
                    email: form.email.value.trim(),
                    displayName: form.displayName.value.trim() || null,
                    password: form.password.value,
                });
                Auth.setSession(result);
                toast(`Account created. Welcome, ${result.user.username}!`);
                window.location.href = '/dashboard.html';
            } catch (err) {
                const fieldErrors = err.errors
                    ? Object.entries(err.errors).map(([field, messages]) => `${field}: ${messages.join(' ')}`).join('<br>')
                    : '';
                alertBox.innerHTML =
                    `<div class="alert alert-danger py-2" style="border-radius:0">${err.message}${fieldErrors ? '<br><small>' + fieldErrors + '</small>' : ''}</div>`;
                button.disabled = false;
                button.textContent = 'Register ▸';
            }
        });
    </script>
</body>
</html>
