services:
  retroshare:
    build: .
    container_name: retroshare
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # Override these for any real deployment — see .env.example.
      Jwt__Secret: "${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      Seed__AdminUsername: "${ADMIN_USERNAME:-admin}"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@retroshare.local}"
      Storage__DefaultUserQuotaBytes: "${DEFAULT_QUOTA_BYTES:-10737418240}"
      Storage__MaxFileSizeBytes: "${MAX_FILE_BYTES:-2147483648}"
    volumes:
      - retroshare-data:/data
    restart: unless-stopped
    healthcheck:
      # curl is installed in the runtime stage; the aspnet base image has no wget.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  retroshare-data:
